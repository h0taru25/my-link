    body {
      margin: 0; min-height: 100vh; padding: 40px 18px;
      display: flex; justify-content: center; align-items: center;
      background: #f7f8fa; color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { width: 100%; max-width: 430px; text-align: center; }
    .avatar {

      background: #fff; color: #252932; text-decoration: none;
      font-size: 16px; font-weight: 600;
      box-shadow: 0 2px 8px rgba(25, 35, 50, .035);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    a:hover { transform: translateY(-2px); border-color: #cfd5de; box-shadow: 0 7px 18px rgba(25,35,50,.07); }
    a:active { transform: scale(.99); }
    .arrow { color: #9aa1ac; font-size: 20px; font-weight: 400; }
    footer { margin-top: 28px; color: #a0a5ae; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
